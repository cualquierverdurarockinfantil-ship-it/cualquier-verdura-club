<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="cv-icon" rel="icon" type="image/png" sizes="48x48" href="/icons/cv-48.png" />
    <link id="cv-icon-svg" rel="icon" type="image/svg+xml" href="/assets/veg/tomate.svg" />
    <link id="cv-apple" rel="apple-touch-icon" href="/icons/cv-180.png" />
    <link id="cv-manifest" rel="manifest" href="/manifest.webmanifest" />
    <meta id="cv-theme" name="theme-color" content="#22c55e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Club Verdura — El lugar secreto de Cualquier Verdura Rock Infantil" />
    <title>Club Verdura</title>
    <meta property="og:title" content="Club Verdura" />
    <meta property="og:description" content="El lugar secreto de Cualquier Verdura Rock Infantil" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://club.cualquierverdurarock.com/icons/og-cv.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff}
      html.cv-hw #boot{background:#1a0a2e}
      #boot .b-hw,#boot .b-fi{display:none}
      html.cv-hw #boot .b-cv,html.cv-fi #boot .b-cv{display:none}
      html.cv-hw #boot .b-hw{display:block;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px rgba(216,200,240,.55))}
      html.cv-fi #boot .b-fi{display:block}
      #boot img{width:min(84vw,400px);height:auto;animation:bootb 1.4s ease-in-out infinite}
      @keyframes bootb{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
      @media (prefers-reduced-motion:reduce){#boot img{animation:none}}
    </style>
    <script>
      // Ícono / pantalla de arranque por fecha (mismas fechas que src/lib/halloween.js y src/lib/fiestas.js).
      // Sin tema activo queda el tomate original. Para otro tema: sumar una entrada con sus fechas y prefijo.
      (function () {
        try {
          var d = new Date();
          var t = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
          var themes = [
            { key: "halloween", cls: "cv-hw", pre: "hw", from: "2026-10-19", to: "2026-11-06", bg: "#1a0a2e", color: "#1a0a2e" },
            { key: "fiestas", cls: "cv-fi", pre: "fi", from: "2026-12-08", to: "2027-01-11", bg: "#ffffff", color: "#16a34a" }
          ];
          var q = new URLSearchParams(location.search);
          var active = null;
          for (var i = 0; i < themes.length; i++) {
            var th = themes[i];
            var on = t >= th.from && t < th.to;
            var qq = q.get(th.key);
            var p = qq === "1" || qq === "0" ? qq : sessionStorage.getItem("cv-" + th.key + "-preview");
            if (p === "1") on = true;
            if (p === "0") on = false;
            if (on) { active = th; break; }
          }
          if (!active) return;
          document.getElementById("cv-icon").href = "/icons/" + active.pre + "-48.png";
          document.getElementById("cv-icon-svg").remove();
          document.getElementById("cv-apple").href = "/icons/" + active.pre + "-180.png";
          document.getElementById("cv-theme").content = active.color;
          document.documentElement.style.background = active.bg;
          document.documentElement.className += " " + active.cls;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="boot"><img class="b-cv" src="/icons/boot-cv.png" alt="Club Verdura" /><img class="b-hw" src="/icons/boot-hw.png" alt="" /><img class="b-fi" src="/icons/boot-fi.png" alt="Felices fiestas" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
